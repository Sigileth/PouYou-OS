---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - type: dnf
    group-install:
      with-optional: true
      packages:
        - virtualization
      exclude:
        - vim-data
        - vim-minimal

  - type: systemd
    system:
      enabled:
        - libvirtd.service

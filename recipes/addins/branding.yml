---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
modules:
  - type: dnf
    install:
      packages:
        - plymouth-plugin-script

  - type: script
    snippets:
      ## Remove Fedora Look and Feel
      - rm -rf /usr/share/plasma/look-and-feel/org.fedoraproject.fedora.desktop
      - rm -rf /usr/share/plasma/look-and-feel/org.fedoraproject.fedoradark.desktop
      - rm -rf /usr/share/plasma/look-and-feel/org.fedoraproject.fedoralight.desktop
      ## Remove Fedora Wallpapers
      - rm -rf /usr/share/wallpapers/*

  - type: files
    files:
      - source: branding
        destination: / # copies files/pouyou/* (* means everything inside it) into your image's root folder /

  - type: script
    snippets:
      - "plymouth-set-default-theme pouyou"

  - type: os-release
    properties:
      NAME: PouYou-OS
      PRETTY_NAME: PouYou-OS
      DEFAULT_HOSTNAME: PouYou-OS
      HOME_URL: https://github.com/Sigileth/PouYou-OS
    # ID_LIKE: fedora
    # ID: pouyou-os

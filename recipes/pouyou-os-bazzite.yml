---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# image will be published to ghcr.io/<user>/<name>
name: pouyou-os-bazzite
# description will be included in the image's metadata
description: This is my personal OS image.

# the base image to build on top of (FROM) and the version tag to use
base-image: ghcr.io/ublue-os/bazzite
image-version: stable-43 # latest is also supported if you want new updates ASAP

# module configuration, executed in order
# you can include multiple instances of the same module
modules:
  - type: files
    files:
      - source: system
        destination: / # copies files/system/* (* means everything inside it) into your image's root folder /

  - type: files
    files:
      - source: pouyou
        destination: / # copies files/pouyou/* (* means everything inside it) into your image's root folder /

  - type: dnf
    repos:
      nonfree: negativo17
    install:
      packages:
        - gwenview
        - kde-partitionmanager
        - okular
        - openrgb
        - plymouth-plugin-script
    remove:
      packages:
        - bazaar
        - bazzite-portal
        - cockpit-networkmanager
        - cockpit-podman
        - cockpit-selinux
        - cockpit-system
        - cockpit-files
        - cockpit-storaged
        - distrobox
        - fw-ectool
        - fw-fanctrl
        - framework-system
        - gnome-disk-utility
        - kdebugsettings
        - kdeconnectd
        - krdc
        - krfb
        - libobs_glcapture
        - libobs_vkcapture
        - lutris
        - pam-u2f
        - pam_yubico
        - pamu2fcfg
        - plasma-workspace-wallpapers
        - ptyxis
        - Sunshine
        - tailscale
        - udica
        - vim-common
        - vim-data
        - vim-enhanced
        - vim-filesystem
        - vim-minimal
        - waydroid
        - webapp-manager
        - xwiimote-ng
        - xxd
        - yubikey-manager

  - type: script
    snippets:
      - "rm /etc/profile.d/bazzite-neofetch.sh" # remove fastfetch aliases
      - "rm /etc/profile.d/dnf-dummy.sh" # remove dummy dnf aliases

  - from-file: addins/branding.yml
  - from-file: addins/virt.yml
  - from-file: addins/flatpaks.yml

  - type: initramfs

  - type: signing # this sets up the proper policy & signing files for signed images to work fully
